[project]
name = "engram-proxy"
version = "0.6.0"
description = "Transparent memory sidecar for local and cloud LLMs - ACT-R activation scoring, provenance-aware formation, ~90ms recall, one SQLite file"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.14", "numpy>=2.0"]
keywords = ["llm", "memory", "agent", "ollama", "proxy", "act-r", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://hicka.github.io/engram/"
Repository = "https://github.com/hicka/engram"
Documentation = "https://hicka.github.io/engram/guide.html"

[project.scripts]
engram = "engram.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engram"]

[tool.setuptools.package-data]
engram = ["ui.html", "lme_watch.html"]
